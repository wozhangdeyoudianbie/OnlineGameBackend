services:
  mysql:
    image: mysql:8.0.46
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: p2_root_dev
      MYSQL_DATABASE: online_game_backend
      MYSQL_USER: p2
      MYSQL_PASSWORD: p2_dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.0.15
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

volumes:
  mysql_data:
